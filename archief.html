<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Archief – Roel van Duijn</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="home" href="./">Roel van Duijn</a>
    <nav id="nav" aria-label="Hoofdmenu"></nav>
  </div>
</header>
<main class="wrap archive">
  <h1 class="page-title">Archief</h1>
  <p class="intro">Alle artikelen van de oude website, 2009 tot 2019.</p>
  <div id="list"></div>
</main>
<script>
const fmt = d => new Date(d).toLocaleDateString('nl-NL', { day:'numeric', month:'long' });
fetch('articles.json').then(r => r.json()).then(list => {
  const el = document.getElementById('list');
  let year;
  for (const a of list) {
    if (a.date.slice(0, 4) !== year) {
      year = a.date.slice(0, 4);
      const h = document.createElement('h3'); h.className = 'year'; h.textContent = year; el.append(h);
    }
    const item = document.createElement('a');
    item.className = 'item'; item.href = 'artikel.html?id=' + a.id;
    item.innerHTML = '<time></time><h3></h3>';
    item.querySelector('time').textContent = fmt(a.date);
    item.querySelector('h3').textContent = a.title;
    el.append(item);
  }
});
</script>
<script src="nav.js?v=16"></script>
</body>
</html>
