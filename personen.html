  <div class="wrap">

<main class="wrap archive">
  <h1 class="page-title">Roel en Rusland</h1>
  <nav class="subnav" aria-label="Roel en Rusland">
    <a href="rusland.html">Afleveringen</a>
    <a href="tijdlijn.html">Tijdlijn</a>

  </nav>

  <p class="intro">Wie er in de reeks voorkomt, en in welke afleveringen. Klik op een naam voor de lijst.</p>
  <div id="people" class="people"></div>
</main>
<script src="posts.js?v=17"></script>
<script>
Promise.all([loadPosts(), fetch('series.json?v=' + DATA_V).then(r => r.json())]).then(([posts, extra]) => {
  const byNo = Object.fromEntries(posts.filter(p => p.series).map(p => [seriesNo(p), p]));
  const el = document.getElementById('people'), open = location.hash.slice(1);
  for (const person of [...extra.people].sort((a, b) => b.cols.length - a.cols.length)) {
    const d = document.createElement('details'); d.id = person.slug; d.open = person.slug === open;
    d.innerHTML = '<summary><strong></strong> <span class="n"></span><span class="desc"></span></summary><ul class="cols"></ul>';
    d.querySelector('strong').textContent = person.name;
    d.querySelector('.n').textContent = person.cols.length === 1 ? '1 aflevering' : person.cols.length + ' afleveringen';
    d.querySelector('.desc').textContent = person.desc;
    const ul = d.querySelector('ul');
    for (const n of person.cols) {
      const p = byNo[n]; if (!p) continue;
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = 'artikel.html?bericht=' + p.id; a.innerHTML = '<b></b> ';
      a.querySelector('b').textContent = n; a.append(postTitle(p) + ' (' + fmtDate(p.date) + ')');
      li.append(a); ul.append(li);
    }
    el.append(d);
  }
  if (open) document.getElementById(open)?.scrollIntoView();
});
</script>
