<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roel van Duijn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <img src="images/portret-1970.jpg" alt="Roel van Duijn, 1970">
    <div>
      <h1>Roel van Duijn</h1>
      <p>Schrijver, activist, mede-oprichter van Provo en de Kabouterbeweging</p>
    </div>
  </div>
</header>
<main class="wrap">
  <h2>Recente berichten</h2>
  <div id="posts"></div>

  <h2>Uit het archief</h2>
  <div class="archive" id="archive"></div>

  <h2>Foto's</h2>
  <div class="gallery">
    <figure><img src="images/portret-2008.jpg" alt="Roel van Duijn op het podium bij GroenLinks, 2008" style="object-position:center"><figcaption>Op het podium bij GroenLinks, 2008<span>Green Bill, CC BY 3.0</span></figcaption></figure>
    <figure><img src="images/kabouters-1971.jpg" alt="Guy Kilian, Roel van Duijn en Peter Hakkenberg van Gaasbeek"><figcaption>Met de Kabouters, 1971<span>Anefo / Nationaal Archief, CC0</span></figcaption></figure>
    <figure><img src="images/fiets-1975.jpg" alt="Van Duijn op de fiets, gevolgd door witkarren"><figcaption>Op de fiets, gevolgd door witkarren, 1975<span>Anefo / Nationaal Archief, CC0</span></figcaption></figure>
    <figure><img src="images/sprookje-1975.jpg" alt="Van Duijn leest een sprookje voor"><figcaption>Leest een sprookje voor, 1975<span>Anefo / Nationaal Archief, CC0</span></figcaption></figure>
    <figure><img src="images/bijlmer-1982.jpg" alt="Roel van Duijn op het balkon van zijn flat in de Bijlmer"><figcaption>Op zijn balkon in de Bijlmer, 1982<span>Hans van Dijk / Anefo, CC0</span></figcaption></figure>
  </div>
</main>
<footer>
  <div class="wrap">
    roelvanduijn.nl<br>
    Foto 2008: Green Bill, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>, via Wikimedia Commons. Overige foto's: Nationaal Archief / Anefo, CC0, via Wikimedia Commons.
  </div>
</footer>
<script>
fetch('posts.json').then(r => r.json()).then(posts => {
  const el = document.getElementById('posts');
  for (const p of posts) {
    const a = document.createElement('article');
    const d = new Date(p.date).toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
    a.innerHTML = `<time></time><p></p>`;
    a.querySelector('time').textContent = d;
    a.querySelector('p').textContent = p.text;
    if (p.image) { const i = document.createElement('img'); i.src = p.image; i.alt = ''; a.append(i); }
    if (p.link) { const l = document.createElement('a'); l.href = p.link; l.textContent = 'Bekijk op Facebook →'; a.append(l); }
    el.append(a);
  }
});

const fmt = d => new Date(d).toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
fetch('articles.json').then(r => r.json()).then(list => {
  const el = document.getElementById('archive');
  for (const a of list) {
    const tmp = document.createElement('div'); tmp.innerHTML = a.html;
    const text = tmp.textContent.replace(/\s+/g, ' ').trim();
    const item = document.createElement('a');
    item.className = 'item'; item.href = 'artikel.html?id=' + a.id;
    item.innerHTML = '<time></time><h3></h3><p></p>';
    item.querySelector('time').textContent = fmt(a.date);
    item.querySelector('h3').textContent = a.title;
    item.querySelector('p').textContent = text.length > 160 ? text.slice(0, 160) + '…' : text;
    el.append(item);
  }
});
</script>
</body>
</html>
