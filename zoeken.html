<body>
<header class="topbar">
  <div class="wrap">
    <a class="home" href="./">Roel van Duijn</a>
    <nav id="nav" aria-label="Hoofdmenu"></nav>
  </div>
</header>
<main class="wrap archive">
  <h1 class="page-title">Zoeken</h1>
  <form class="finder" role="search" onsubmit="return false">
    <label for="q">Zoek in de hele site</label>
    <input id="q" type="search" placeholder="Bijvoorbeeld Provo, Krim of afscheid nemen" autocomplete="off" autofocus>
  </form>
  <div class="themes" role="group" aria-label="Soort" id="kinds"></div>
  <p class="count" id="count" aria-live="polite">De zoekindex wordt geladen…</p>
  <div id="list"></div>
  <button type="button" class="more-btn" id="more" hidden>Toon meer resultaten</button>
</main>
<script src="posts.js?v=14"></script>
<script>
const KINDS = ['Rusland en Roel', 'Bericht', 'Archief', 'Boek', 'In de pers', 'Pagina'];
const PLURAL = { 'Rusland en Roel': 'Rusland en Roel', Bericht: 'Berichten', Archief: 'Archief', Boek: 'Boeken', 'In de pers': 'In de pers', Pagina: "Pagina's" };
const q = document.getElementById('q'), kindsBox = document.getElementById('kinds'), list = document.getElementById('list'), more = document.getElementById('more');
let items = [], kind = '', shown = 30, timer;
q.value = new URLSearchParams(location.search).get('q') || '';

fetch('search.json?v=' + DATA_V).then(r => r.json()).then(data => {
  items = data.map(it => ({ ...it, f: fold(it.t + ' ' + it.x), ft: fold(it.t) }));
  update();
});

function results(terms) {
  if (!terms.length) return [];
  const out = [];
  for (const it of items) {
    if (!terms.every(w => it.f.includes(w))) continue;
    let score = 0;
    for (const w of terms) { if (it.ft.includes(w)) score += 10; score += Math.min(5, it.f.split(w).length - 1); }
    out.push([score, it]);
  }
  return out.sort((a, b) => b[0] - a[0] || (b[1].d || '').localeCompare(a[1].d || '')).map(x => x[1]);
}

function update() {
  const terms = fold(q.value).split(/\s+/).filter(w => w.length > 1);
  const all = results(terms);
  kindsBox.replaceChildren();
  if (terms.length) {
    const counts = Object.fromEntries(KINDS.map(k => [k, all.filter(it => it.k === k).length]));
    const add = (k, label, n) => {
      if (k && !n) return;
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', k === kind);
      b.innerHTML = '<span></span> <small></small>';
      b.querySelector('span').textContent = label; b.querySelector('small').textContent = n;
      b.addEventListener('click', () => { kind = k; shown = 30; update(); });
      kindsBox.append(b);
    };
    add('', 'Alles', all.length);
    for (const k of KINDS) add(k, PLURAL[k], counts[k]);
  }
  const found = kind ? all.filter(it => it.k === kind) : all;
  document.getElementById('count').textContent = !terms.length ? 'Typ een of meer woorden.'
    : found.length ? found.length + (found.length === 1 ? ' resultaat' : ' resultaten') + ' voor ‘' + q.value.trim() + '’'
    : 'Niets gevonden voor ‘' + q.value.trim() + '’. Probeer een ander of korter woord.';
  list.replaceChildren();
  for (const it of found.slice(0, shown)) {
    const a = document.createElement('a'); a.className = 'item plain hit'; a.href = it.u;
    a.innerHTML = '<span class="series"></span><h3></h3><p></p>';
    a.querySelector('.series').textContent = [it.k === 'Bericht' ? 'Facebook' : it.k, it.s, it.d && fmtDate(it.d)].filter(Boolean).join(', ');
    a.querySelector('h3').textContent = it.t;
    a.querySelector('p').innerHTML = snippet({ text: it.x }, terms);
    list.append(a);
  }
  more.hidden = found.length <= shown;
  const url = q.value.trim() ? '?q=' + encodeURIComponent(q.value.trim()) : location.pathname;
  history.replaceState(null, '', url);
}
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { shown = 30; kind = ''; update(); }, 150); });
more.addEventListener('click', () => { shown += 30; update(); });
</script>
