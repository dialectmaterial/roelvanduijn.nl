  <p class="intro">De oorlog maand voor maand: wat er gebeurde, en wat Roel er die maand over schreef. Nieuwste maand bovenaan.</p>
  <div id="timeline" class="timeline"></div>

<script src="posts.js?v=17"></script>
<script>
const MONTHS = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
Promise.all([loadPosts(), fetch('series.json?v=' + DATA_V).then(r => r.json())]).then(([posts, extra]) => {
  const series = posts.filter(p => p.series);
  const months = new Map();
  const add = (key, kind, item) => { if (!months.has(key)) months.set(key, { events: [], cols: [] }); months.get(key)[kind].push(item); };
  for (const e of extra.events) add(e.date.slice(0, 7), 'events', e);
  for (const p of series) add(p.date.slice(0, 7), 'cols', p);
  const el = document.getElementById('timeline');
  let year;
  for (const key of [...months.keys()].sort().reverse()) {
    const [y, m] = key.split('-'), { events, cols } = months.get(key);
    if (y !== year) { const h = document.createElement('h2'); h.className = 'year'; h.textContent = year = y; el.append(h); }
    const sec = document.createElement('section'); sec.className = 'month'; sec.id = key;
    sec.innerHTML = '<h3></h3>'; sec.querySelector('h3').textContent = MONTHS[Number(m) - 1];
    for (const e of events.sort((a, b) => a.date.localeCompare(b.date))) {
      const p = document.createElement('p'); p.className = 'event';
      p.innerHTML = '<span></span> '; p.querySelector('span').textContent = Number(e.date.slice(8)) + ' ' + MONTHS[Number(m) - 1];
      p.append(e.text); sec.append(p);
    }
    const ul = document.createElement('ul'); ul.className = 'cols';
    for (const p of cols.sort((a, b) => seriesNo(a) - seriesNo(b))) {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = 'artikel.html?bericht=' + p.id;
      a.innerHTML = '<b></b> '; a.querySelector('b').textContent = seriesNo(p); a.append(postTitle(p));
      li.append(a); ul.append(li);
    }
    if (cols.length) sec.append(ul);
    el.append(sec);
  }
});
</script>
