<body>

<main class="wrap archive">
  <h1 class="page-title">Boeken</h1>
  <p class="intro">Alle boeken van Roel, van zijn eerste Provo-pamfletten tot zijn nieuwste boek. De meeste kun je bij hem bestellen, gesigneerd: <a href="mailto:roelvduijn@planet.nl?subject=Boek%20bestellen">mail Roel</a>.</p>
  <div id="bio"></div>
  <div id="list"></div>
</main>
<script src="posts.js?v=18"></script>
<script>
fetch('books.json?v=' + DATA_V).then(r => r.json()).then(all => {
  // The biography about Roel gets its own block; the list is his own books.
  const bio = all.find(b => b.about), books = all.filter(b => !b.about);
  if (bio) {
    const box = document.getElementById('bio');
    box.className = 'bio-box';
    box.innerHTML = '<p class="kicker">De meest complete biografie over Roel</p><h2></h2><p class="meta-line"></p>';
    box.querySelector('h2').textContent = bio.title;
    box.querySelector('.meta-line').textContent = 'Door ' + bio.author + '. ' + bio.publisher + ', ' + bio.year + ', 430 bladzijden.';
  }
  const el = document.getElementById('list');
  let decade;
  for (const b of books) {
    const d = Math.floor(b.year / 10) * 10;
    if (d !== decade) {
      const h = document.createElement('h2'); h.className = 'year'; decade = d;
      h.textContent = d + '–' + Math.min(d + 9, books[0].year);
      el.append(h);
    }
    const row = document.createElement(b.url ? 'a' : 'div');
    row.className = 'item book-row' + (b.cover ? ' has-cover' : '');
    if (b.url) row.href = b.url;
    row.innerHTML = '<time></time><h3></h3>';
    row.querySelector('time').textContent = b.year;
    row.querySelector('h3').textContent = b.title;
    for (const [cls, text] of [['sub', b.subtitle], ['series', b.publisher], ['note', b.note]]) {
      if (!text) continue;
      const e = document.createElement(cls === 'series' ? 'span' : 'p'); e.className = cls; e.textContent = text; row.append(e);
    }
    if (b.cover) { const i = document.createElement('img'); i.src = b.cover; i.alt = ''; i.className = 'mini-cover'; row.append(i); }
    el.append(row);
  }
});
</script>
