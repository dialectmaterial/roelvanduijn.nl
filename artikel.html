<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roel van Duijn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap post">
  <a class="back" href="./">← Roel van Duijn</a>
  <article style="border:0;padding:0;margin-top:24px">
    <time></time>
    <h1></h1>
    <div class="body"></div>
    <p class="orig"></p>
  </article>
</main>
<script>
const id = Number(new URLSearchParams(location.search).get('id'));
fetch('articles.json').then(r => r.json()).then(list => {
  const a = list.find(x => x.id === id);
  if (!a) { document.querySelector('h1').textContent = 'Artikel niet gevonden'; return; }
  document.title = a.title + ' – Roel van Duijn';
  document.querySelector('time').textContent = new Date(a.date).toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
  document.querySelector('h1').textContent = a.title;
  document.querySelector('.body').innerHTML = a.html;
  document.querySelector('.orig').textContent = 'Oorspronkelijk gepubliceerd op roelvanduijn.nl';
});
</script>
</body>
</html>
