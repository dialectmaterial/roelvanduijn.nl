<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Doorsturen…</title>
<link rel="canonical" href="https://roelvanduijn.nl/liefdesverdriet/"><meta http-equiv="refresh" content="2; url=/liefdesverdriet/"><script>
(async () => {
  const q = new URLSearchParams(location.search), key = q.has('bericht') ? 'bericht:' + q.get('bericht') : q.has('pagina') ? (location.pathname.includes('liefdesverdriet') ? 'ld:' : 'pagina:') + q.get('pagina') : q.has('id') ? 'id:' + q.get('id') : null;
  if (!key) return;
  const map = await fetch('/data/redirects.json').then(r => r.json());
  const to = map[key] || (key.startsWith('id:') && map['pagina:' + key.slice(3)]);
  if (to) location.replace(to);
})();
</script></head>
<body><p><a href="/liefdesverdriet/">Deze pagina is verhuisd.</a></p></body></html>
